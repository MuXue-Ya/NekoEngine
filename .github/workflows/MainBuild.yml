name: Main Build

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  HAXE_VER: 4.3.7

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VER }}

      - name: Cache haxelib dependencies
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/haxe/${{ env.HAXE_VER }}/x64/lib
          key: haxelib-${{ runner.os }}-${{ hashFiles('hmm.json') }}
          restore-keys: |
            haxelib-${{ runner.os }}-

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup
          haxelib run hmm install
          haxelib run lime rebuild hxcpp --quiet

      - name: Configure Android
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Cache ASTC textures
        uses: actions/cache@v4
        with:
          path: astc-textures
          key: astc-${{ runner.os }}-${{ hashFiles('assets/**/*.png', 'astc-compression-data.json') }}

      - name: Compress Textures (ASTC)
        run: |
          ASTC_DIR=$(haxelib path astc-compressor | head -1)
          chmod +x "$ASTC_DIR"/plugins/Linux/x64/astcenc-* || true
          haxelib run astc-compressor compress-from-json -json ./astc-compression-data.json
          python3 scripts/astc_backfill.py

      - name: Cache hxcpp build objects
        uses: actions/cache@v4
        with:
          path: export/release/android/obj
          # key 含源码 hash: 源码一变必 miss 全量重编(正确性保证);
          # 源码没变时用 restore-keys 命中最近一次 obj -> 增量编译只编变化文件
          key: hxcpp-obj-${{ github.run_id }}-${{ hashFiles('source/**/*.hx', 'Project.xml', 'hmm.json') }}
          restore-keys: |
            hxcpp-obj-${{ github.run_id }}-
            hxcpp-obj-

      - name: Normalize mtimes (incremental correctness)
        # checkout 会把源文件 mtime 刷成当前时间 -> hxcpp 认为所有源都比缓存 obj 新而全量重编;
        # 归一到 1970 使 obj(缓存恢复的 mtime) 新于源 -> 未变文件跳过编译。源内容一致性由上面 key 的 hash 保证。
        run: |
          find source -name "*.hx" -print0 | xargs -0 touch -d "@0"
          touch -d "@0" Project.xml

      - name: Compile
        run: haxelib run lime build android -release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NekoEngine-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
